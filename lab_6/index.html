<!doctype html>
<html lang="uk">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Зміна кольору заголовка</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
		/>
	</head>
	<body
		class="d-flex flex-column align-items-center justify-content-center vh-100"
		id="backgroundClr"
	>
		<!-- Заголовок, колір якого змінюватиметься -->
		<h1 id="heading" class="mb-3">Змінюй мій колір!</h1>

		<!-- Поле введення кольору -->
		<input
			type="text"
			id="colorInput"
			class="form-control w-50 mb-3"
			placeholder="Введіть назву або HEX-код кольору"
		/>

		<!-- Кнопка для зміни кольору заголовка -->
		<button id="changeColor" class="btn btn-primary">Змінити колір</button>

		<script src="script.js"></script>
	</body>
</html>
